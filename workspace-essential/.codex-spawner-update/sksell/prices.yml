# =====================================================================
#  Automatic pricing
# =====================================================================
#  Minecraft has well over a thousand items and the list above covers a
#  couple of hundred. Everything left over is priced here by keyword, so
#  a player who brings you a stack of pink candles is not told "this
#  cannot be sold" for no reason.
#
#  Turn this off and only the items listed above are sellable - which is
#  the right choice if you want to control the economy item by item.
# =====================================================================
auto-pricing:

  enabled: true

  # Price for an item that matches no rule below.
  default-price: 1

  # Category an item lands in when its rule names none.
  # Must be one of the category keys above.
  default-category: natural

  # Items whose name contains any of these are never given a price.
  # This is the "not obtainable in survival" list: command blocks, spawn
  # eggs, barriers and friends. Selling those would let anyone with
  # creative access print money.
  # Matching is on the material name in lower case with underscores as
  # spaces, so 'spawn egg' matches ZOMBIE_SPAWN_EGG.
  never-sell:
    - 'spawn egg'
    - 'command block'
    - 'structure'
    - 'jigsaw'
    - 'barrier'
    - 'bedrock'
    - 'debug'
    - 'knowledge book'
    - 'end portal frame'
    - 'reinforced deepslate'
    - 'budding amethyst'
    - 'infested'
    - 'farmland'
    - 'dirt path'
    - 'petrified'
    - 'player head'
    - 'spawner'
    - 'trial key'
    - 'vault'
    - 'light'

  # The rules, checked top to bottom - the FIRST match wins, so put the
  # expensive keywords first. 'netherite' before 'iron' matters, because
  # NETHERITE_UPGRADE_SMITHING_TEMPLATE contains neither, while
  # NETHERITE_AXE contains 'netherite' only.
  #
  #   contains:   any of these words in the material name
  #   price:      what one item is worth
  #   category:   which multiplier track it feeds
  rules:
    - contains: ['netherite']
      price: 500
      category: ores
    - contains: ['diamond']
      price: 30
      category: ores
    - contains: ['emerald']
      price: 45
      category: ores
    - contains: ['smithing template']
      price: 150
      category: armor
    - contains: ['music disc']
      price: 40
      category: blocks
    - contains: ['shulker']
      price: 100
      category: mobs
    - contains: ['head', 'skull']
      price: 150
      category: mobs
    - contains: ['gold']
      price: 35
      category: ores
    - contains: ['iron']
      price: 45
      category: ores
    - contains: ['copper']
      price: 8
      category: ores
    - contains: ['wool', 'banner', 'bed']
      price: 4
      category: blocks
    - contains: ['coral', 'candle']
      price: 4
      category: natural
    - contains: ['concrete', 'terracotta', 'glass', 'sapling', 'seeds', 'boat', 'sign', 'door', 'fence', 'stairs', 'slab', 'carpet', 'dye']
      price: 3
      category: blocks