# =====================================================================
#  SKSell - the price table
# =====================================================================
#  This is the file you will edit most. It answers two questions at once:
#  what is an item worth, and which category does it belong to.
#
#  A category is a progression track: selling crops raises the crops
#  multiplier and nothing else (see multipliers in settings.yml). It is
#  also one button in /sellmulti and one page in /worth.
#
#  ADDING AN ITEM
#    put  MATERIAL_NAME: price  under the items: of a category.
#    Material names are the Minecraft ones in capitals, e.g. GOLD_INGOT.
#    An unknown name is reported in the console on startup and skipped,
#    so a typo costs you one item and never the whole file.
#
#  REMOVING AN ITEM
#    delete the line. If auto-pricing below is on it may come back with a
#    generic price - list it under auto-pricing.never-sell instead.
#
#  ADDING A CATEGORY
#    copy a whole block, give it a new key, and pick a free menu-slot.
#    Everything else follows automatically: the /sellmulti button, its
#    detail page and its own multiplier track.
#
#  A price of 0 or less means "cannot be sold".
# =====================================================================


