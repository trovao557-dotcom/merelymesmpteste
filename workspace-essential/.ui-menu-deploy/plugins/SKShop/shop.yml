# =====================================================================
#  Shop - the catalogue
# =====================================================================
#  Everything the shop SELLS lives in this file: the categories, their
#  menus, the products, the prices and where each one sits.
#  How the shop BEHAVES is in settings.yml, and the confirmation screen
#  is in menu-buy.yml.
# =====================================================================


# ---------------------------------------------------------------------
#  The shared look of every product button
# ---------------------------------------------------------------------
defaults:

  name: '&f%item%'

  money-lore:
    - '&fPrice: &#71F521%price_full%'
    - '&e'
    - '&#FFD900&l▶ &#FFD900&l&nCLICK&#FFD900 to buy'

  points-lore:
    - '&fPrice: &#00E0FF%price_full%'
    - '&e'
    - '&#FFD900&l▶ &#FFD900&l&nCLICK&#FFD900 to buy'

  money-label: '$'
  points-label: 'Points'

  money-format: '$%price%'
  points-format: '%price% Points'


# ---------------------------------------------------------------------
#  The front page
# ---------------------------------------------------------------------
main-menu:

  menu:
    title: '&f'
    filler-symbol: '-'
    layout:
      - '---------'
      - '--GNFSR--'
      - '---------'

  items:

    close:
      material: BARRIER
      name: '&#FF2121&lCLOSE'
      lore:
        - '&#FF2121▶ &fClick to close the shop'
      symbol: 'q'
      action: close


