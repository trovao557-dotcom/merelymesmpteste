name: MerelyClaims
version: 1.0.0
main: com.merelyme.claims.MerelyClaims
api-version: '1.21'
author: MerelyMeSMP
description: 150 persistent playtime milestones with personal rewards and boosts.
softdepend: [PlaceholderAPI, Vault, SKCore, SKCrates, SKTags, LuckPerms, MerelyEvents]
commands:
