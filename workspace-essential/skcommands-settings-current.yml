# =====================================================================
#  SKCommands - what players see when they type a slash
# =====================================================================
#  A fresh Paper server hands the client several hundred commands:
#  every vanilla one, every alias, the internals of every plugin, and a
#  namespaced copy of each ("minecraft:me", "luckperms:lp"). This list
#  is what survives that.
#
#  Names go in WITHOUT the slash. Aliases are separate entries - hiding
#  "msg" does not hide "tell", because to the client they are two
#  commands. Namespaces are handled automatically: "msg" also covers
#  "minecraft:msg".
#
#  HIDING IS NOT BLOCKING. This only changes what the client is TOLD
#  about; a player who knows a name can still type it, exactly as before.
#  Every command that mattered was already behind its own permission.
#  Set block-hidden: true if you also want them refused - see below.
#
#  After editing: /skcommands reload
# =====================================================================

enabled: true

# Players with this permission see the full tree, untouched. Keep an eye
# on it: it is what stops a mistake in the list from locking you out.
see-all-permission: skcommands.see-all

# Every command also exists in a namespaced form - "skshop:shop",
# "minecraft:me" - which is what the client shows when two plugins
# register the same name. Nobody types those, and they double the list.
hide-namespaced: true

# false = the list only decides what is SHOWN (recommended).
# true  = a command not on the list is also refused when typed. Powerful
#         and easy to regret: anything you forget to list stops working
#         for everyone without the permission above.
block-hidden: true


