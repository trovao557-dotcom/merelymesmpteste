messages:
  # %command%
  hidden: '&#00B5FF&lSMP &#9B9B9B» &#FF2121This command does not exist! &7(/help)'
  # %count%
  # %count% visible commands, %players% clients that got the new tree
  reloaded: '&#00B5FF&lSMP &#9B9B9B» &#71F521Reloaded - &f%count% &#71F521commands
    visible, &f%players% &#71F521clients refreshed.'
  usage: '&7/skcommands reload'
# Language of everything this plugin says: EN or DE.
#
# EN is the default and reads this file. DE lays the translation in
# lang/de/ over it - the file you are reading stays English and stays the
# reference. A line the translation does not have falls back to English,
# so nothing breaks if you add a setting we have not translated yet.
#
# The translated files are yours to edit as well, same as this one.
language: EN
