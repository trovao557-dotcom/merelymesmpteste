# =====================================================================
#  SKInfo - the information screens
# =====================================================================
#  /help    a command overview; a click opens that system
#  /guide   what this server is, in one screen
#  /media   the creator programme and how to apply
#  /discord the Discord link, clickable
#  /store   the store link, clickable
#  /skinfo reload
#
#  HOW A MENU WORKS
#  Every entry has a `slot`, a face (material, name, lore) and one of:
#    run:          a command, run as the player. The screen closes first.
#    message:      lines printed into the chat instead.
#    message-from: the name of a list under this menu's `texts:` - for
#                  when several icons say the same thing.
#  An entry with neither does nothing when clicked, which is right for a
#  card that is only there to be read.
#
#  Colours: &a style codes and &#RRGGBB hex both work everywhere.
# =====================================================================

# Language of everything this plugin says: EN or DE.
#
# EN is the default and reads this file. DE lays the translation in
# lang/de/ over it - the file you are reading stays English and stays the
# reference. A line the translation does not have falls back to English,
# so nothing breaks if you add a setting we have not translated yet.
#
# The translated files are yours to edit as well, same as this one.
language: EN

prefix: '&#00B5FF&lSMP &#9B9B9B» '


# ---------------------------------------------------------------------
#  Sounds
# ---------------------------------------------------------------------
sounds:
  menu-open:
    sound: 'block.chest.open'
    volume: 0.8
    pitch: 1.3
  click:
    sound: 'ui.button.click'
    volume: 0.7
    pitch: 1.2
  read:
    sound: 'entity.experience_orb.pickup'
    volume: 1.0
    pitch: 1.4
  link:
    sound: 'entity.experience_orb.pickup'
    volume: 0.8
    pitch: 1.5


# ---------------------------------------------------------------------
#  The clickable links
# ---------------------------------------------------------------------
#  Two blank lines are printed around each one on purpose: a link
#  somebody has to click is worth nothing if it scrolls past inside a
#  wall of chat.
links:

  discord:
    heading: '      &#00B5FF&lDISCORD SERVER'
    text: '       &f&ndiscord.gg/S9gCBe7m2'
    url: 'https://discord.gg/S9gCBe7m2'
    hover: '&#71F521Click to join!'

  # The address is a placeholder. Put your own in, or delete this whole
  # entry if you do not run a store - /store then says so politely.
  store:
    heading: '      &#FFD900&lSTORE'
    text: '       &f&nmerelymesmp.com'
    url: 'https://merelymesmp.com'
    hover: '&#71F521Click to open!'


