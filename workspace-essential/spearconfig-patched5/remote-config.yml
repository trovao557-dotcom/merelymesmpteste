# Each tier has an independent master toggle and amount.
# An enabled limit of 0 allows no spears of that tier to be crafted.
limits:
  wood:
    enabled: true
    amount: 50
  stone:
    enabled: true
    amount: 40
  copper:
    enabled: true
    amount: 30
  iron:
    enabled: true
    amount: 30
  gold:
    enabled: true
    amount: 20
  diamond:
    enabled: true
    amount: 15
  netherite:
    enabled: true
    amount: 5

# Remove spear drops from naturally spear-carrying mobs.
blockMobDrop: false

# Each attack cooldown has an independent master toggle.
cooldown:
  jab:
    enabled: false
    seconds: 0
  lunge:
    enabled: false
    seconds: 1

# Compatible enchantments are discovered from Paper's registry on startup.
# Each discovered key receives:
#   allowed: true
#   maxLevel: the enchantment's vanilla maximum
enchantable: true
enchantments:
  minecraft:bane_of_arthropods:
    allowed: true
    maxLevel: 5
  minecraft:fire_aspect:
    allowed: true
    maxLevel: 2
  minecraft:knockback:
    allowed: true
    maxLevel: 2
  minecraft:looting:
    allowed: true
    maxLevel: 3
  minecraft:lunge:
    allowed: true
    maxLevel: 3
  minecraft:mending:
    allowed: true
    maxLevel: 1
  minecraft:sharpness:
    allowed: true
    maxLevel: 5
  minecraft:smite:
    allowed: true
    maxLevel: 5
  minecraft:unbreaking:
    allowed: true
    maxLevel: 3
  minecraft:vanishing_curse:
    allowed: true
    maxLevel: 1

# Inventory owners are considered spear wielders.
glow: false
tab: false
color: GOLD

reveal:
  enabled: false
  interval: 300

announcements:
  chat: true
  title: true
